[build-system]
requires = ["setuptools>=61.0.0", "setuptools_scm[toml]>=8.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-otp-u2f"
description = "django-otp device implementation for U2F/Webauthn"
readme = "README.rst"
requires-python = ">=3.10"
license = { text = "GNU General Public License v3" }
keywords = ["django-otp", "universal", "2nd", "factor", "u2f", "yubico", "webauthn"]
authors = [
    { name = "Harm Geerts", email = "hgeerts@osso.nl" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Environment :: Web Environment",
    "Natural Language :: English",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration :: Authentication/Directory"
]
dependencies = [
    "django-otp~=1.7.0",
    "fido2~=2.2.1",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/ossobv/django-otp-u2f/"

[project.optional-dependencies]
kleides-mfa = [
    "kleides-mfa~=0.2.2",
]

[dependency-groups]
dev = [
    "coverage",
    "factory-boy",
    "pytest",
    "pytest-cov",
    "pytest-django",
]
docs = [
    "readthedocs-sphinx-search==0.1.0",
    "Sphinx==4.0.3",
    "sphinx-rtd-theme==0.5.2",
]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
exclude = ["build", "dist", "docs", "tests"]

[tool.setuptools_scm]
# Required to activate setuptools_scm.
